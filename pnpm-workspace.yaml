minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - typescript
  - '@typescript/typescript-*'
  - '@typescript/typescript6' # TS6 wrapper behind the typescript alias
overrides:
  nanoid@3: 3.3.15
  postcss: 8.5.16
blockExoticSubdeps: true # no git branch as package url
supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
    - win32
